[project]
name = "chatty"
version = "0.1.0"
description = "Local meeting assistant with OpenAI Live voice sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
chatty = "chatty.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP", "W"]
ignore = ["E501"] # Leave line wrapping to the formatter.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
