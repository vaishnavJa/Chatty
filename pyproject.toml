[project]
name = "agent-hub"
version = "0.1.0"
description = "Scaffold for a conversational agent service with external integrations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-hub = "agent_hub.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
src = ["src"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP", "W"]
ignore = ["E501"] # Leave line wrapping to the formatter.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
